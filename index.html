<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pessoas - Cálculo de IMC</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Cadastro de Pessoas</h1>
        
        <form id="form-cadastro">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required>
            </div>
            
            <div class="form-group">
                <label>Sexo:</label>
                <div class="radio-group">
                    <label><input type="radio" name="sexo" value="Masculino" required> Masculino</label>
                    <label><input type="radio" name="sexo" value="Feminino" required> Feminino</label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="dataNascimento">Data de Nascimento:</label>
                <input type="date" id="dataNascimento" required>
            </div>
            
            <div class="form-group">
                <label for="peso">Peso (kg):</label>
                <input type="number" id="peso" step="0.1" required>
            </div>
            
            <div class="form-group">
                <label for="altura">Altura (m):</label>
                <input type="number" id="altura" step="0.01" required>
            </div>
            
            <button type="submit" id="btn-adicionar">Adicionar Pessoa</button>
        </form>

        <hr>

        <h2>Lista de Pessoas</h2>
        <div id="lista-pessoas-container">
            <ul id="lista-pessoas">
                <!-- As pessoas cadastradas aparecerão aqui -->
            </ul>
        </div>
    </div>

    <script type="module" src="js/script.js"></script>
</body>
</html>
